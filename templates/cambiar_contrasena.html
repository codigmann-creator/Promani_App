
{% extends "base.html" %}

{% block title %}Cambiar contraseña - Promani{% endblock %}

{% block content %}

<style>
    /* CONTENEDOR */
    .contrasena-contenedor {
        max-width: 650px;
        margin: 35px auto;
        padding: 30px;
        background: white;
        border: 1px solid #dce4eb;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
    }

    .contrasena-contenedor h2 {
        color: #18344f;
        margin-bottom: 10px;
    }

    .contrasena-descripcion {
        color: #536779;
        margin-bottom: 25px;
    }

    /* CAMPOS DEL FORMULARIO */
    .contrasena-campo { margin-bottom: 20px; }

    .contrasena-campo label {
        display: block;
        font-weight: 600;
        color: #18344f;
        margin-bottom: 8px;
    }

    .contrasena-campo input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 14px;
    }

    .contrasena-campo input:focus {
        outline: 2px solid #3295c3;
        border-color: #3295c3;
    }

    /* BOTÓN */
    .contrasena-boton {
        background: #18344f;
        color: white;
        border: none;
        border-radius: 7px;
        padding: 12px 20px;
        cursor: pointer;
        font-weight: 600;
    }

    .contrasena-boton:hover { background: #285477; }

    /* MENSAJES */
    .contrasena-mensaje {
        padding: 13px;
        margin-bottom: 20px;
        border-radius: 7px;
    }

    .contrasena-error {
        background: #fff1f2;
        color: #991b1b;
        border: 1px solid #fecdd3;
    }

    .contrasena-exito {
        background: #ecfdf5;
        color: #166534;
        border: 1px solid #bbf7d0;
    }
</style>

<div class="contrasena-contenedor">
    <h2>Cambiar contraseña</h2>
    <p class="contrasena-descripcion">
        Actualiza tu contraseña para mantener segura tu cuenta de Promani.
    </p>

    {% if mensaje %}
        <div class="contrasena-mensaje contrasena-{{ tipo_mensaje }}" role="status">
            {{ mensaje }}
        </div>
    {% endif %}

    <!-- FORMULARIO DE CAMBIO DE CONTRASEÑA -->
    <form method="POST" action="{{ url_for('cambiar_contrasena') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="contrasena-campo">
            <label for="contrasena_actual">Contraseña actual</label>
            <input type="password" id="contrasena_actual"
                   name="contrasena_actual" autocomplete="current-password" required>
        </div>

        <div class="contrasena-campo">
            <label for="contrasena_nueva">Nueva contraseña</label>
            <input type="password" id="contrasena_nueva"
                   name="contrasena_nueva" autocomplete="new-password"
                   minlength="8" required>
        </div>

        <div class="contrasena-campo">
            <label for="confirmar_contrasena">Confirmar nueva contraseña</label>
            <input type="password" id="confirmar_contrasena"
                   name="confirmar_contrasena" autocomplete="new-password"
                   minlength="8" required>
        </div>

        <button type="submit" class="contrasena-boton">
            Actualizar contraseña
        </button>
    </form>
</div>

{% endblock %}
