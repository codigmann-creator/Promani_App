<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Promani</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='login.css') }}"
    >

</head>


<body class="login-page">


    <div class="login-contenedor">


        <div class="login-logo">

            <img
                src="{{ url_for('static', filename='images/logo_promani.png') }}"
                alt="Logo Promani"
            >

        </div>


        <div class="login-contenido">


            <section class="login-presentacion">

                <h1>
                    Bienvenido
                </h1>

                <p>
                    Sistema de Gestión de Pedidos e Inventario
                    desarrollado para centralizar y facilitar
                    el control de materiales, pedidos y procesos
                    internos de Promani.
                </p>

            </section>


            <section class="login-panel">

                <h2>
                    Iniciar Sesión
                </h2>

                <p class="descripcion-login">
                    Ingrese sus credenciales para acceder al sistema.
                </p>


                <form method="POST" action="/login">


                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        required
                        autofocus
                    >


                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required
                    >


                    <button type="submit">
                        Ingresar al sistema
                    </button>


                </form>


                <p class="login-pie">
                    Sistema de uso interno de Promani
                </p>


            </section>


        </div>


    </div>


</body>

</html>
