<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Consumo - Promani</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Registrar Consumo de Material</h1>
        <p>Promani</p>
    </header>

    <main>

        <h2>Asociar material a un pedido</h2>

        <form method="POST" action="/nuevo-consumo">

            <label for="pedido_id">Pedido</label>
            <select id="pedido_id" name="pedido_id" required>

                <option value="">Seleccione un pedido</option>

                {% for pedido in pedidos %}
                    <option value="{{ pedido['id'] }}">
                        Pedido #{{ pedido['id'] }} - {{ pedido['cliente'] }} - {{ pedido['descripcion'] }}
                    </option>
                {% endfor %}

            </select>

            <label for="material_id">Material</label>
            <select id="material_id" name="material_id" required>

                <option value="">Seleccione un material</option>

                {% for material in materiales %}
                    <option value="{{ material['id'] }}">
                        {{ material['nombre'] }} - Stock: {{ material['stock'] }} {{ material['unidad'] }}
                    </option>
                {% endfor %}

            </select>

            <label for="cantidad">Cantidad utilizada</label>
            <input
                type="number"
                id="cantidad"
                name="cantidad"
                min="0.01"
                step="0.01"
                required
            >

            <button type="submit">Registrar consumo</button>

        </form>

    </main>

</body>
</html>
