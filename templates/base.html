
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Promani{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='formularios.css') }}">
</head>

<body>
    <!-- ENCABEZADO -->
    <header class="encabezado-principal">
        <div class="encabezado-contenido">
            <div class="marca">
                <h1>Promani</h1>
                <p>Sistema de Gestión de Pedidos e Inventario</p>
            </div>

            <div class="usuario-header">
                <span>{{ session["usuario"] }}</span>
                <span class="rol-usuario">{{ session["rol"] }}</span>
            </div>

            <button type="button" class="boton-menu" id="boton-menu"
                    aria-label="Abrir menú" aria-expanded="false">☰</button>
        </div>

        <!-- NAVEGACIÓN -->
        <nav class="barra-navegacion" id="barra-navegacion">
            <a href="/">Inicio</a>
            <a href="/pedidos">Pedidos</a>
            <a href="/inventario">Inventario</a>

            {% if session["rol"] == "administrador" %}
                <a href="/proveedores">Proveedores</a>
                <a href="/usuarios">Usuarios</a>
            {% endif %}

            <a href="/cambiar-contrasena">Cambiar contraseña</a>
            <a href="/logout" class="cerrar-sesion">Cerrar sesión</a>
        </nav>
    </header>

    <!-- CONTENIDO DE CADA PÁGINA -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- MENÚ RESPONSIVO -->
    <script>
        const botonMenu = document.getElementById("boton-menu");
        const barraNavegacion = document.getElementById("barra-navegacion");

        botonMenu.addEventListener("click", () => {
            const abierto = barraNavegacion.classList.toggle("abierto");
            botonMenu.setAttribute("aria-expanded", String(abierto));
            botonMenu.textContent = abierto ? "✕" : "☰";
        });

        barraNavegacion.querySelectorAll("a").forEach(enlace => {
            enlace.addEventListener("click", () => {
                if (window.innerWidth <= 650) {
                    barraNavegacion.classList.remove("abierto");
                    botonMenu.textContent = "☰";
                    botonMenu.setAttribute("aria-expanded", "false");
                }
            });
        });
    </script>
</body>
</html>
